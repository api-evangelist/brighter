name: Brighter
description: >-
  Brighter is a Santa Monica, California digital health technology company
  founded in 2010 by internet entrepreneur Jake Winebaum that built a
  consumer-driven dental benefits platform connecting dentists, patients, and
  dental insurers. Brighter licensed digital engagement solutions to insurance
  carriers, including online and mobile provider directories, patient reviews,
  and its proprietary Brighter Schedule online appointment scheduling feature,
  along with the Brighter PRO self-insured dental plan launched in 2014. Its
  platform powered member-engagement tools for major dental insurers including
  Cigna, Delta Dental, and Aetna. Backed by roughly $49M from General Catalyst,
  Mayfield, Benchmark, DAG Ventures, and Tenaya Capital, Brighter was acquired
  by Cigna in December 2017 and its technology folded into Cigna's digital
  health offerings. The brand persists as a Cigna dental provider experience.
